name: Backtest JP225 2021-2023 All Sessions Monthly
on:
  push:
    paths:
      - "backtest_2021_2023_sessions_monthly.py"
      - "DAT_ASCII_JPXJPY_M1_2021.csv"
      - "DAT_ASCII_JPXJPY_M1_2022.csv"
      - "DAT_ASCII_JPXJPY_M1_2023.csv"
      - ".github/workflows/backtest_2021_2023_sessions_monthly.yml"
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python backtest_2021_2023_sessions_monthly.py
      - uses: actions/upload-artifact@v4
        with:
          name: jp225-backtest-2021-2023-all-sessions-monthly
          path: |
            monthly_sessions_2021_2023.csv
            trades_2021_2023_asia.csv
            trades_2021_2023_europe.csv
            trades_2021_2023_america.csv
            trades_2021_2023_all.csv
